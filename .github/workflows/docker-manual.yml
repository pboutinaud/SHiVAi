name: Docker Image CI - Manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à builder"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - run: git describe --tags
      
