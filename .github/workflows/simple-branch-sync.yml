name: GH / GHE Branch Sync

on:
    push:
        branches:
            - $BRANCH_NAME
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        if: ${{ vars.BRANCH_NAME != '' && vars.TARGET_REPO != '' && vars.TARGET_URL != '' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: $BRANCH_NAME
                  fetch-depth: 0

            - name: Sync $BRANCH_NAME branch to $TARGET_REPO
              run: |
                git remote add origin https://${{ secrets.TARGET_REPO_TOKEN }}@${TARGET_URL}/${TARGET_REPO}.git
                git push --mirror origin