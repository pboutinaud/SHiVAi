name: GH / GHE Branch Sync

on:
    push:
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        if: ${{ vars.BRANCH_NAME != '' && vars.TARGET_REPO != '' && vars.TARGET_URL != '' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ vars.BRANCH_NAME }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Debug token presence
              run: echo "Token length is ${#TOKEN}"
              env:
                TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
            - name: Debug URL vars
              run: |
                echo "TARGET_URL=${{ vars.TARGET_URL }}"
                echo "TARGET_REPO=${{ vars.TARGET_REPO }}"
            - name: Sync ${{ vars.BRANCH_NAME }} branch to ${{ vars.TARGET_REPO }}
              run: |
                git remote set-url origin https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@${{ vars.TARGET_URL }}/${{ vars.TARGET_REPO }}.git
                git push --mirror origin