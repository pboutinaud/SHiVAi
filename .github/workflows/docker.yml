name: Docker Image CI

on:
  release:
    types: [released]

jobs:
  build:
    if: ${{ github.repository == 'pboutinaud/SHiVAi' }}
    runs-on: ubuntu-latest
    steps:
    
    - uses: actions/checkout@v4

    - uses: mr-smithers-excellent/docker-build-push@v7
      name: Build & push Docker image
      with:
        image: vnozais/shivai
        addLatest: true
        registry: docker.io
        dockerfile: Dockerfile
        username: ${{ secrets.DOCKER_USERNAME_VN }}
        password: ${{ secrets.DOCKER_PASSWORD_VN }}
